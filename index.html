<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Estadísticas de Fútbol</title>
    <!-- Cargamos Chart.js desde su CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
            color: white;
        }

        .btn-add { background-color: var(--primary); }
        .btn-add:hover { background-color: #1d4ed8; }
        
        .btn-load { background-color: var(--secondary); }
        .btn-load:hover { background-color: #059669; }

        .counter-badge {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h1>Dashboard Estadístico de Partidos</h1>
    </div>

    <div class="container">
        <!-- Panel Izquierdo: Formulario de Entrada -->
        <div class="card">
            <h2>Ingreso de Datos</h2>
            <div class="counter-badge" id="registroContador">Registros actuales: 0</div>
            
            <form id="dataForm">
                <div class="form-group">
                    <label>Corners / Tiros de Esquina</label>
                    <input type="number" id="corners" min="0" required>
                </div>
                <div class="form-group">
                    <label>Tarjetas Amarillas</label>
                    <input type="number" id="amarillas" min="0" required>
                </div>
                <div class="form-group">
                    <label>Tarjetas Rojas</label>
                    <input type="number" id="rojas" min="0" required>
                </div>
                <div class="form-group">
                    <label>Remates a Puerta</label>
                    <input type="number" id="remates" min="0" required>
                </div>
                <div class="form-group">
                    <label>Total de Goles</label>
                    <input type="number" id="goles" min="0" required>
                </div>
                <div class="form-group">
                    <label>Faltas Cometidas</label>
                    <input type="number" id="faltas" min="0" required>
                </div>

                <button type="button" class="btn-add" onclick="agregarRegistro()">Guardar Registro</button>
                <button type="button" class="btn-load" onclick="cargarGraficaYTabla()">Cargar Resultados</button>
            </form>
        </div>

        <!-- Panel Derecho: Gráfica y Tabla -->
        <div class="card">
            <h2>Análisis de Tendencias</h2>
            <div class="chart-container">
                <canvas id="miGrafica"></canvas>
            </div>

            <h2 style="margin-top: 40px;">Promedios Estadísticos</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Corners</th>
                            <th>T. Amarillas</th>
                            <th>T. Rojas</th>
                            <th>Remates</th>
                            <th>Goles</th>
                            <th>Faltas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="avg-corners">0.00</td>
                            <td id="avg-amarillas">0.00</td>
                            <td id="avg-rojas">0.00</td>
                            <td id="avg-remates">0.00</td>
                            <td id="avg-goles">0.00</td>
                            <td id="avg-faltas">0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Arreglo para almacenar la data en memoria
        let registros = [];
        let chartInstance = null;

        function agregarRegistro() {
            // Obtenemos los valores de los inputs
            const corners = parseInt(document.getElementById('corners').value) || 0;
            const amarillas = parseInt(document.getElementById('amarillas').value) || 0;
            const rojas = parseInt(document.getElementById('rojas').value) || 0;
            const remates = parseInt(document.getElementById('remates').value) || 0;
            const goles = parseInt(document.getElementById('goles').value) || 0;
            const faltas = parseInt(document.getElementById('faltas').value) || 0;

            // Guardamos el objeto en nuestro arreglo
            registros.push({ corners, amarillas, rojas, remates, goles, faltas });
            
            // Actualizamos la UI y limpiamos el formulario
            document.getElementById('registroContador').innerText = `Registros actuales: ${registros.length}`;
            document.getElementById('dataForm').reset();
            
            // Foco de nuevo al primer input para captura rápida
            document.getElementById('corners').focus();
        }

        function cargarGraficaYTabla() {
            if (registros.length === 0) {
                alert('Por favor, ingresa al menos un registro antes de cargar los resultados.');
                return;
            }
            actualizarTabla();
            actualizarGrafica();
        }

        function actualizarTabla() {
            const total = registros.length;
            
            // Sumamos todos los valores usando reduce
            const sumas = registros.reduce((acc, curr) => {
                acc.corners += curr.corners;
                acc.amarillas += curr.amarillas;
                acc.rojas += curr.rojas;
                acc.remates += curr.remates;
                acc.goles += curr.goles;
                acc.faltas += curr.faltas;
                return acc;
            }, { corners: 0, amarillas: 0, rojas: 0, remates: 0, goles: 0, faltas: 0 });

            // Calculamos el promedio e inyectamos al HTML
            document.getElementById('avg-corners').innerText = (sumas.corners / total).toFixed(2);
            document.getElementById('avg-amarillas').innerText = (sumas.amarillas / total).toFixed(2);
            document.getElementById('avg-rojas').innerText = (sumas.rojas / total).toFixed(2);
            document.getElementById('avg-remates').innerText = (sumas.remates / total).toFixed(2);
            document.getElementById('avg-goles').innerText = (sumas.goles / total).toFixed(2);
            document.getElementById('avg-faltas').innerText = (sumas.faltas / total).toFixed(2);
        }

        function actualizarGrafica() {
            const ctx = document.getElementById('miGrafica').getContext('2d');
            
            // Destruir la gráfica anterior si existe para evitar superposiciones
            if (chartInstance) {
                chartInstance.destroy();
            }

            // Etiquetas dinámicas para el Eje X (Partido 1, Partido 2, etc.)
            const labels = registros.map((_, index) => `Registro ${index + 1}`);

            // Extracción de datos para las líneas
            const dataCorners = registros.map(r => r.corners);
            const dataAmarillas = registros.map(r => r.amarillas);
            const dataRojas = registros.map(r => r.rojas);
            const dataRemates = registros.map(r => r.remates);
            const dataGoles = registros.map(r => r.goles);
            const dataFaltas = registros.map(r => r.faltas);

            // Configuración de Chart.js
            chartInstance = new Chart(ctx, {
                type: 'line', // Tipo de gráfica (líneas con puntos marcados)
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Corners', data: dataCorners, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.3 },
                        { label: 'T. Amarillas', data: dataAmarillas, borderColor: '#eab308', backgroundColor: '#eab308', tension: 0.3 },
                        { label: 'T. Rojas', data: dataRojas, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.3 },
                        { label: 'Remates', data: dataRemates, borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', tension: 0.3 },
                        { label: 'Goles', data: dataGoles, borderColor: '#22c55e', backgroundColor: '#22c55e', tension: 0.3 },
                        { label: 'Faltas', data: dataFaltas, borderColor: '#f97316', backgroundColor: '#f97316', tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
