<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Predictivo - PREDICCIONES</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 380px 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { font-weight: 600; color: #475569; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; color: white; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #1e3a8a; }
        .btn-success { background: #16a34a; }
        .btn-danger { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; }
        .chart-container { height: 340px; margin-top: 15px; }
        .win { color: #16a34a; font-weight: bold; }
        .draw { color: #3b82f6; font-weight: bold; }
        .loss { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>PREDICCIONES</h1>
    <p>Análisis con Regresión Lineal • Cada equipo inicia desde 0 partidos</p>
</div>

<div class="grid">

    <!-- INGRESO DE DATOS -->
    <div class="card">
        <h2>Ingreso de Datos</h2>
        <form id="partidoForm">
            <label>Identificador del Equipo</label>
            <input type="text" id="equipoId" placeholder="Ej. MARRUECOS" required style="text-transform: uppercase;">

            <label>Oponente</label>
            <input type="text" id="oponente" placeholder="Ej. Paraguay" required>

            <label>Resultado</label>
            <select id="resultado" required>
                <option value="ganado">Ganado</option>
                <option value="empate">Empate</option>
                <option value="perdido">Perdido</option>
            </select>

            <label>Corners</label>
            <input type="number" id="corners" required>
            <label>Tarjetas Amarillas</label>
            <input type="number" id="amarillas" required>
            <label>Tarjetas Rojas</label>
            <input type="number" id="rojas" required>
            <label>Remates a Puerta</label>
            <input type="number" id="remates" required>
            <label>Total de Goles</label>
            <input type="number" id="goles" required>
            <label>Faltas Cometidas</label>
            <input type="number" id="faltas" required>

            <label>Tipo de selección que enfrentaste</label>
            <select id="tipoOponente" required>
                <option value="normal">Normal / No especificado</option>
                <option value="ofensiva">Ofensiva</option>
                <option value="defensiva">Defensiva</option>
                <option value="presion">Alta Presión</option>
                <option value="equilibrada">Equilibrada</option>
            </select>

            <button type="submit" class="btn-primary">💾 Guardar Registro</button>
        </form>

        <div style="margin-top: 20px;">
            <button onclick="subirArchivoDirecto(true)" class="btn-success">➕ Agregar JSON (sin reemplazar)</button>
            <button onclick="limpiarDatos()" class="btn-danger" style="margin-top: 8px;">🗑️ Limpiar todos los datos</button>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="procesarArchivo(this)">
    </div>

    <!-- ANÁLISIS -->
    <div class="card">
        <h2>Análisis Individual</h2>

        <label>Equipo</label>
        <select id="selectEquipo" onchange="analizarEquipo()"></select>

        <label>Tipo de Regresión</label>
        <select id="tipoRegresion" onchange="analizarEquipo()">
            <option value="todos">1. Todos los partidos (Normal)</option>
            <option value="ofensiva">2. Solo vs Ofensivas</option>
            <option value="defensiva">3. Solo vs Defensivas</option>
            <option value="presion">4. Solo vs Alta Presión</option>
            <option value="equilibrada">5. Solo vs Equilibradas</option>
        </select>

        <label>Métrica para Gráfica</label>
        <select id="metrica" onchange="analizarEquipo()">
            <option value="corners">Corners</option>
            <option value="goles">Goles</option>
            <option value="remates">Remates a Puerta</option>
            <option value="amarillas">Tarjetas Amarillas</option>
        </select>

        <div class="chart-container">
            <canvas id="grafica"></canvas>
        </div>

        <h3 style="margin-top: 20px;">Estadísticas Proyectadas (Partido N+1)</h3>
        <table>
            <thead>
                <tr>
                    <th>Métrica</th>
                    <th>Promedio</th>
                    <th>Predicción</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>

        <div id="estadisticasExtra" style="margin-top: 20px; font-size: 0.95rem;"></div>
    </div>
</div>

<script>
let BD_EQUIPOS = {};
let chartInstance = null;

const metricas = ['corners', 'amarillas', 'rojas', 'remates', 'goles', 'faltas'];
const nombres = { corners: 'Corners', amarillas: 'Amarillas', rojas: 'Rojas', remates: 'Remates', goles: 'Goles', faltas: 'Faltas' };

function guardar() {
    localStorage.setItem('dashboard_bd', JSON.stringify(BD_EQUIPOS));
}

function cargar() {
    const data = localStorage.getItem('dashboard_bd');
    if (data) BD_EQUIPOS = JSON.parse(data);
}

function actualizarSelectores() {
    const sel = document.getElementById('selectEquipo');
    sel.innerHTML = '';
    Object.keys(BD_EQUIPOS).forEach(eq => {
        if (BD_EQUIPOS[eq].length > 0) {
            const opt = document.createElement('option');
            opt.value = eq;
            opt.textContent = eq;
            sel.appendChild(opt);
        }
    });
}

document.getElementById('partidoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('equipoId').value.trim().toUpperCase();
    if (!id) return;

    const partido = {
        oponente: document.getElementById('oponente').value.trim(),
        resultado: document.getElementById('resultado').value,
        corners: +document.getElementById('corners').value || 0,
        amarillas: +document.getElementById('amarillas').value || 0,
        rojas: +document.getElementById('rojas').value || 0,
        remates: +document.getElementById('remates').value || 0,
        goles: +document.getElementById('goles').value || 0,
        faltas: +document.getElementById('faltas').value || 0,
        tipo_oponente: document.getElementById('tipoOponente').value
    };

    if (!BD_EQUIPOS[id]) BD_EQUIPOS[id] = [];
    BD_EQUIPOS[id].push(partido);
    guardar();
    actualizarSelectores();
    document.getElementById('selectEquipo').value = id;
    analizarEquipo();
    this.reset();
});

function subirArchivoDirecto(merge) {
    const input = document.getElementById('fileInput');
    input.dataset.merge = merge;
    input.click();
}

function procesarArchivo(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const nuevos = JSON.parse(e.target.result);
            const merge = input.dataset.merge === 'true';

            if (merge) {
                for (let eq in nuevos) {
                    if (!BD_EQUIPOS[eq]) BD_EQUIPOS[eq] = [];
                    BD_EQUIPOS[eq] = BD_EQUIPOS[eq].concat(nuevos[eq]);
                }
            } else {
                BD_EQUIPOS = nuevos;
            }
            guardar();
            actualizarSelectores();
            alert('Datos importados correctamente');
        } catch (err) {
            alert('Error: ' + err.message);
        }
    };
    reader.readAsText(file);
    input.value = '';
}

function calcularRegresion(datos, metrica) {
    const n = datos.length;
    if (n === 0) return { m: 0, b: 0 };
    if (n === 1) return { m: 0, b: datos[0][metrica] };

    let sx = 0, sy = 0, sxy = 0, sx2 = 0;
    for (let i = 0; i < n; i++) {
        const x = i + 1;
        const y = datos[i][metrica];
        sx += x; sy += y; sxy += x * y; sx2 += x * x;
    }
    const m = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
    const b = (sy - m * sx) / n;
    return { m, b };
}

function analizarEquipo() {
    const equipo = document.getElementById('selectEquipo').value;
    const tipo = document.getElementById('tipoRegresion').value;
    const metrica = document.getElementById('metrica').value;
    const tbody = document.getElementById('tablaBody');
    tbody.innerHTML = '';

    if (!equipo || !BD_EQUIPOS[equipo]) return;

    let datos = BD_EQUIPOS[equipo];
    if (tipo !== 'todos') {
        datos = datos.filter(p => p.tipo_oponente === tipo);
    }

    if (datos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">No hay datos para este filtro.</td></tr>`;
        if (chartInstance) chartInstance.destroy();
        return;
    }

    // Calcular regresión para la métrica seleccionada
    const reg = calcularRegresion(datos, metrica);
    const n = datos.length;
    const predX = n + 1;
    const predY = reg.m * predX + reg.b;

    // Llenar tabla
    metricas.forEach(m => {
        const r = calcularRegresion(datos, m);
        const promedio = datos.reduce((a, c) => a + c[m], 0) / datos.length;
        const prediccion = r.m * predX + r.b;

        const fila = `
            <tr>
                <td><strong>${nombres[m]}</strong></td>
                <td>${promedio.toFixed(2)}</td>
                <td><strong style="color:#166534;">${prediccion.toFixed(2)}</strong></td>
            </tr>
        `;
        tbody.innerHTML += fila;
    });

    // Gráfica con regresión
    crearGraficaConRegresion(datos, metrica, reg.m, reg.b);

    // Estadísticas de resultados
    mostrarEstadisticasResultados(datos);
}

function crearGraficaConRegresion(datos, metrica, m, b) {
    const ctx = document.getElementById('grafica').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const n = datos.length;
    const labels = datos.map((_, i) => `P${i+1}`);
    labels.push(`Pred. P${n+1}`);

    const valoresReales = datos.map(d => d[metrica]);
    valoresReales.push(null);

    const linea = [];
    for (let i = 1; i <= n + 1; i++) {
        linea.push(Math.max(0, m * i + b));
    }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: 'Histórico', data: valoresReales, backgroundColor: '#3b82f6', barThickness: 22, type: 'bar' },
                { label: 'Tendencia', data: linea, borderColor: '#ef4444', borderWidth: 3.5, type: 'line', tension: 0.15 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
}

function mostrarEstadisticasResultados(datos) {
    const cont = document.getElementById('estadisticasExtra');
    if (datos.length === 0) {
        cont.innerHTML = '';
        return;
    }

    let ganados = 0, empates = 0, perdidos = 0;
    datos.forEach(p => {
        if (p.resultado === 'ganado') ganados++;
        else if (p.resultado === 'empate') empates++;
        else if (p.resultado === 'perdido') perdidos++;
    });

    const total = datos.length;
    const pGanados = (ganados / total * 100).toFixed(1);
    const pEmpates = (empates / total * 100).toFixed(1);
    const pPerdidos = (perdidos / total * 100).toFixed(1);

    cont.innerHTML = `
        <strong>Resultados:</strong><br>
        <span class="win">${pGanados}% Victorias</span> • 
        <span class="draw">${pEmpates}% Empates</span> • 
        <span class="loss">${pPerdidos}% Derrotas
    `;
}

function limpiarDatos() {
    if (confirm('¿Borrar todos los datos?')) {
        localStorage.removeItem('dashboard_bd');
        location.reload();
    }
}

window.onload = function() {
    cargar();
    actualizarSelectores();
    const equipos = Object.keys(BD_EQUIPOS);
    if (equipos.length > 0) {
        document.getElementById('selectEquipo').value = equipos[0];
        analizarEquipo();
    }
};
</script>

</body>
</html>
