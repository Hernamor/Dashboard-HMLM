<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Modelos Predictivos</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --surface-inner: #0f1f35;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981; /* Verde esmeralda similar al de tu imagen */
            --warn: #fbbf24;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Encabezado */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }

        .header .school-tag {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sistema de Pestañas (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-button {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 12px 25px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-button:hover {
            color: var(--text-main);
        }

        .tab-button.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tarjetas y Formularios */
        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        input[type="number"], input[type="text"], select {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Botones de Acción */
        .btn-evaluar {
            background-color: #2c3e50;
            color: white;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .btn-evaluar:hover {
            background-color: #34495e;
        }

        /* Bloques de Resultados */
        .result-block {
            background-color: var(--surface-inner);
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            transition: background-color 0.3s;
        }

        .covid-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .covid-box {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px 10px;
            text-align: center;
        }

        .covid-box .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .covid-box .value {
            font-size: 1.5rem;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Panel de Modelos Predictivos</h1>
            <p>Desarrollado por: Hernández Morales Luis Manuel</p>
            <span class="school-tag">Fundamentos de Analítica de Datos | UPIICSA</span>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="abrirPestana(event, 'tab-alumnos')">Modelo Alumnos</button>
            <button class="tab-button" onclick="abrirPestana(event, 'tab-covid')">Modelo Clínico COVID-19</button>
        </div>

        <div id="tab-alumnos" class="tab-content active">
            <div class="card">
                <h2 class="card-title">Predicción de Rendimiento Escolar</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Horas de Estudio</label>
                        <input type="number" id="alum-horas" value="14" min="0">
                    </div>
                    <div class="form-group">
                        <label>Asistencia (%)</label>
                        <input type="number" id="alum-asist" value="50" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label>Entregó Tareas</label>
                        <select id="alum-tareas">
                            <option value="1">Sí (1)</option>
                            <option value="0">No (0)</option>
                        </select>
                    </div>
                </div>

                <button class="btn-evaluar" onclick="evaluarAlumno()">Evaluar Alumno</button>

                <div id="alum-resultado" class="result-block" style="background-color: var(--surface-inner); color: var(--text-muted);">
                    Esperando datos...
                </div>
            </div>
        </div>

        <div id="tab-covid" class="tab-content">
            <div class="card">
                <h2 class="card-title">Datos del Paciente</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="cov-edad" value="45" min="0">
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="cov-genero">
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel de atención</label>
                        <input type="number" id="cov-nivel" value="2">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Diagnóstico</label>
                        <input type="text" id="cov-dx" value="COVID-19">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" id="cov-estado" value="CIUDAD DE MÉXICO">
                    </div>
                    <div class="form-group">
                        <label>Municipio</label>
                        <input type="text" id="cov-mun" value="IZTAPALAPA">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Intervención</label>
                        <select id="cov-intervencion">
                            <option value="Oxigeno">Oxígeno</option>
                            <option value="Intubacion">Intubación</option>
                            <option value="Ninguna">Ninguna</option>
                        </select>
                    </div>
                </div>

                <button class="btn-evaluar" style="background-color: var(--success); border-color: var(--success);" onclick="evaluarCovid()">Generar Pronóstico Clínico</button>

                <div class="covid-results">
                    <div class="covid-box">
                        <div class="label">Requerimiento de Tubo</div>
                        <div class="value" id="res-tubo" style="color: var(--text-muted);">--</div>
                    </div>
                    <div class="covid-box">
                        <div class="label">Estancia Estimada</div>
                        <div class="value" id="res-estancia" style="color: var(--text-main);">-- días</div>
                    </div>
                    <div class="covid-box">
                        <div class="label">Riesgo de Mortalidad</div>
                        <div class="value" id="res-riesgo" style="color: var(--text-muted);">--</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // LÓGICA DE INTERFAZ: CAMBIO DE PESTAÑAS
        // ==========================================
        function abrirPestana(evt, idPestana) {
            let i, tabcontent, tablinks;
            
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            
            document.getElementById(idPestana).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        // ==========================================
        // LÓGICA MATEMÁTICA: ÁRBOL DE ALUMNOS
        // Basado en: Si (horas > 5) AND (asistencia > 60) AND (tarea == 1)
        // ==========================================
        function evaluarAlumno() {
            // Extracción de datos del formulario
            const horas = parseFloat(document.getElementById('alum-horas').value);
            const asistencia = parseFloat(document.getElementById('alum-asist').value);
            const tareas = parseInt(document.getElementById('alum-tareas').value);
            
            const bloqueResultado = document.getElementById('alum-resultado');

            // Simulación del Árbol de Decisión / Algoritmo Manual
            if (horas > 5 && asistencia > 60 && tareas === 1) {
                bloqueResultado.innerText = "Resultado Predicho: APROBADO";
                bloqueResultado.style.backgroundColor = "var(--success)";
                bloqueResultado.style.color = "white";
            } else {
                bloqueResultado.innerText = "Resultado Predicho: REPROBADO";
                bloqueResultado.style.backgroundColor = "var(--danger)";
                bloqueResultado.style.color = "white";
            }
        }

        // ==========================================
        // LÓGICA MATEMÁTICA: ÁRBOL CLÍNICO COVID-19
        // Toma los inputs visuales y calcula las ramas dinámicamente
        // ==========================================
        function evaluarCovid() {
            // Extracción de variables clave para el árbol
            const edad = parseInt(document.getElementById('cov-edad').value);
            const intervencion = document.getElementById('cov-intervencion').value;
            const dx = document.getElementById('cov-dx').value.toUpperCase();

            // Punteros del DOM para imprimir resultados
            const domTubo = document.getElementById('res-tubo');
            const domEstancia = document.getElementById('res-estancia');
            const domRiesgo = document.getElementById('res-riesgo');

            // Variables de salida
            let requiereTubo = "NO";
            let diasEstancia = 0;
            let nivelRiesgo = "BAJO";
            let colorRiesgo = "var(--success)";
            let colorTubo = "var(--success)";

            // Simulación de ramificaciones del Árbol de Decisión (CART)
            // Nodo Raíz: Intervención Médica
            if (intervencion === "Intubacion") {
                requiereTubo = "SÍ";
                colorTubo = "var(--danger)";
                
                // Nodo Secundario: Edad
                if (edad > 60) {
                    nivelRiesgo = "MUY ALTO";
                    colorRiesgo = "var(--danger)";
                    diasEstancia = 21.5;
                } else {
                    nivelRiesgo = "ALTO";
                    colorRiesgo = "var(--warn)";
                    diasEstancia = 15.0;
                }
            } 
            else if (intervencion === "Oxigeno") {
                requiereTubo = "NO";
                colorTubo = "var(--success)";

                // Nodo Secundario: Diagnóstico y Edad
                if (dx.includes("COVID") && edad > 50) {
                    nivelRiesgo = "MEDIO";
                    colorRiesgo = "var(--warn)";
                    diasEstancia = 8.5;
                } else {
                    nivelRiesgo = "BAJO";
                    colorRiesgo = "var(--success)";
                    diasEstancia = 4.2;
                }
            } 
            else { // Intervención: Ninguna
                requiereTubo = "NO";
                colorTubo = "var(--success)";
                
                if (edad > 70) {
                    nivelRiesgo = "MEDIO";
                    colorRiesgo = "var(--warn)";
                    diasEstancia = 5.0;
                } else {
                    nivelRiesgo = "BAJO";
                    colorRiesgo = "var(--success)";
                    diasEstancia = 1.5;
                }
            }

            // Inyección de resultados calculados a la interfaz
            domTubo.innerText = requiereTubo;
            domTubo.style.color = colorTubo;

            domEstancia.innerText = diasEstancia.toFixed(1) + " días";

            domRiesgo.innerText = nivelRiesgo;
            domRiesgo.style.color = colorRiesgo;
        }
    </script>
</body>
</html>
