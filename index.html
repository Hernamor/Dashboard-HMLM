<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Predictivo - PREDICCIONES</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { font-weight: 600; color: #475569; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; color: white; cursor: pointer; margin-top: 8px; }
        .btn-primary { background-color: #1e3a8a; }
        .btn-success { background-color: #16a34a; }
        .btn-danger { background-color: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; }
        .chart-container { height: 320px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h1>PREDICCIONES</h1>
    <p>Análisis con Regresión Lineal • Cada equipo inicia desde 0 partidos</p>
</div>

<div class="grid">

    <!-- INGRESO DE DATOS -->
    <div class="card">
        <h2>Ingreso de Datos</h2>
        <form id="partidoForm">
            <label>Identificador del Equipo</label>
            <input type="text" id="equipoId" placeholder="Ej. MARRUECOS" required style="text-transform: uppercase;">

            <label>Corners</label>
            <input type="number" id="corners" required>

            <label>Tarjetas Amarillas</label>
            <input type="number" id="amarillas" required>

            <label>Tarjetas Rojas</label>
            <input type="number" id="rojas" required>

            <label>Remates a Puerta</label>
            <input type="number" id="remates" required>

            <label>Total de Goles</label>
            <input type="number" id="goles" required>

            <label>Faltas Cometidas</label>
            <input type="number" id="faltas" required>

            <label>Tipo de selección que enfrentaste</label>
            <select id="tipoOponente" required>
                <option value="normal">Normal / No especificado</option>
                <option value="ofensiva">Ofensiva</option>
                <option value="defensiva">Defensiva</option>
                <option value="presion">Alta Presión</option>
                <option value="equilibrada">Equilibrada</option>
            </select>

            <button type="submit" class="btn-primary">💾 Guardar Registro</button>
        </form>

        <div style="margin-top: 25px;">
            <button onclick="subirArchivoDirecto(true)" class="btn-success">➕ Agregar JSON sin reemplazar</button>
            <button onclick="limpiarLocalStorage()" class="btn-danger" style="margin-top: 8px;">🗑️ Limpiar todos los datos</button>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="procesarArchivo(this)">
    </div>

    <!-- ANÁLISIS -->
    <div class="card">
        <h2>Análisis Individual</h2>

        <label>Equipo</label>
        <select id="selectEquipo" onchange="analizarEquipo()"></select>

        <label>Tipo de Regresión</label>
        <select id="tipoRegresion" onchange="analizarEquipo()">
            <option value="todos">1. Todos los partidos (Normal)</option>
            <option value="ofensiva">2. Solo vs Ofensivas</option>
            <option value="defensiva">3. Solo vs Defensivas</option>
            <option value="presion">4. Solo vs Alta Presión</option>
            <option value="equilibrada">5. Solo vs Equilibradas</option>
        </select>

        <label>Métrica para Gráfica</label>
        <select id="metrica" onchange="analizarEquipo()">
            <option value="corners">Corners</option>
            <option value="goles">Goles</option>
            <option value="remates">Remates a Puerta</option>
            <option value="amarillas">Tarjetas Amarillas</option>
        </select>

        <div class="chart-container">
            <canvas id="grafica"></canvas>
        </div>

        <h3 style="margin-top: 25px;">Estadísticas Proyectadas (Partido N+1)</h3>
        <table>
            <thead>
                <tr>
                    <th>Métrica</th>
                    <th>Promedio</th>
                    <th>Predicción</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>

</div>

<script>
let BD_EQUIPOS = {};
let chart = null;

function guardar() {
    localStorage.setItem('dashboard_bd', JSON.stringify(BD_EQUIPOS));
}

function cargar() {
    const data = localStorage.getItem('dashboard_bd');
    if (data) BD_EQUIPOS = JSON.parse(data);
}

function actualizarSelectores() {
    const select = document.getElementById('selectEquipo');
    select.innerHTML = '';
    const equipos = Object.keys(BD_EQUIPOS).filter(k => BD_EQUIPOS[k].length > 0);
    equipos.forEach(eq => {
        const opt = document.createElement('option');
        opt.value = eq;
        opt.textContent = eq;
        select.appendChild(opt);
    });
}

document.getElementById('partidoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('equipoId').value.trim().toUpperCase();
    if (!id) return;

    const partido = {
        corners: parseInt(document.getElementById('corners').value) || 0,
        amarillas: parseInt(document.getElementById('amarillas').value) || 0,
        rojas: parseInt(document.getElementById('rojas').value) || 0,
        remates: parseInt(document.getElementById('remates').value) || 0,
        goles: parseInt(document.getElementById('goles').value) || 0,
        faltas: parseInt(document.getElementById('faltas').value) || 0,
        tipo_oponente: document.getElementById('tipoOponente').value
    };

    if (!BD_EQUIPOS[id]) BD_EQUIPOS[id] = [];
    BD_EQUIPOS[id].push(partido);
    guardar();
    actualizarSelectores();
    document.getElementById('selectEquipo').value = id;
    analizarEquipo();
    this.reset();
});

function subirArchivoDirecto(merge) {
    const input = document.getElementById('fileInput');
    input.dataset.merge = merge;
    input.click();
}

function procesarArchivo(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const nuevos = JSON.parse(ev.target.result);
            const merge = input.dataset.merge === 'true';

            if (merge) {
                for (let eq in nuevos) {
                    if (!BD_EQUIPOS[eq]) BD_EQUIPOS[eq] = [];
                    BD_EQUIPOS[eq] = BD_EQUIPOS[eq].concat(nuevos[eq]);
                }
            } else {
                BD_EQUIPOS = nuevos;
            }

            guardar();
            actualizarSelectores();
            alert('Datos importados correctamente');
        } catch (err) {
            alert('Error al importar: ' + err.message);
        }
    };
    reader.readAsText(file);
    input.value = '';
}

function analizarEquipo() {
    const equipo = document.getElementById('selectEquipo').value;
    const tipo = document.getElementById('tipoRegresion').value;
    const metrica = document.getElementById('metrica').value;

    const tbody = document.getElementById('tablaBody');
    tbody.innerHTML = '';

    if (!equipo || !BD_EQUIPOS[equipo]) return;

    let datos = BD_EQUIPOS[equipo];

    // Filtrar por tipo de oponente
    if (tipo !== 'todos') {
        datos = datos.filter(p => p.tipo_oponente === tipo);
    }

    if (datos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3">No hay partidos de este tipo.</td></tr>`;
        if (chart) chart.destroy();
        return;
    }

    // Calcular regresión
    const n = datos.length;
    let sumaX = 0, sumaY = 0, sumaXY = 0, sumaX2 = 0;
    for (let i = 0; i < n; i++) {
        const x = i + 1;
        const y = datos[i][metrica];
        sumaX += x; sumaY += y; sumaXY += x * y; sumaX2 += x * x;
    }
    const m = (n * sumaXY - sumaX * sumaY) / (n * sumaX2 - sumaX * sumaX);
    const b = (sumaY - m * sumaX) / n;

    // Llenar tabla
    metricasLista.forEach(mKey => {
        const promedio = datos.reduce((a, c) => a + c[mKey], 0) / datos.length;
        const pred = m * (n + 1) + b;
        const row = `<tr>
            <td>${nombresMetricas[mKey]}</td>
            <td>${promedio.toFixed(2)}</td>
            <td><strong>${pred.toFixed(2)}</strong></td>
        </tr>`;
        tbody.innerHTML += row;
    });

    // Gráfica simple
    const ctx = document.getElementById('grafica').getContext('2d');
    if (chart) chart.destroy();

    const labels = datos.map((_, i) => 'P' + (i+1));
    const valores = datos.map(d => d[metrica]);

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: metrica,
                data: valores,
                backgroundColor: '#3b82f6'
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

const metricasLista = ['corners', 'amarillas', 'rojas', 'remates', 'goles', 'faltas'];
const nombresMetricas = {
    corners: 'Corners', amarillas: 'Amarillas', rojas: 'Rojas',
    remates: 'Remates', goles: 'Goles', faltas: 'Faltas'
};

function limpiarLocalStorage() {
    if (confirm('¿Borrar todos los datos?')) {
        localStorage.removeItem('dashboard_bd');
        location.reload();
    }
}

// Inicialización
window.onload = function() {
    cargar();
    actualizarSelectores();
    
    const equipos = Object.keys(BD_EQUIPOS);
    if (equipos.length > 0) {
        document.getElementById('selectEquipo').value = equipos[0];
        analizarEquipo();
    }
};
</script>

</body>
</html>
