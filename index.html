 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Predictivo HMLM </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-dark: #1f2937;
            --surface-inner: #111827;
            --accent: #7f1d1d;
            --accent-hover: #991b1b;
            --text-main: #ffffff;
            --text-muted: #ffffff;
            --border: #374151;
            --result-color: #ffffff;
        }

        * {
            color: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 30px 20px;
            transition: background-color 0.5s ease;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .subtitle {
            margin: 0;
            font-size: 1rem;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .grid-modelos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select {
            background-color: var(--surface-inner);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: monospace;
            transition: border-color 0.3s;
            width: 100%;
            box-sizing: border-box;
            color: #ffffff;
        }

        select option {
            background-color: var(--surface-inner);
            color: #ffffff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffffff;
        }

        button {
            background-color: var(--accent);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .metric-box {
            background-color: var(--surface-inner);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px 10px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.70rem;
            text-transform: uppercase;
        }

        .output-box {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Alumno: Hernández Morales Luis Manuel</h1>
            <p class="subtitle">Sistema Clínico Predictivo: COVID-19</p>
        </header>

        <div class="grid-modelos">
            
            <article class="card">
                <h2>1. Clasificador: Rendimiento Escolar</h2>
                
                <div class="control-grid">
                    <div class="form-group">
                        <label>Horas de Estudio</label>
                        <input type="number" id="alum-horas" value="14" min="0">
                    </div>
                    <div class="form-group">
                        <label>Asistencia (%)</label>
                        <input type="number" id="alum-asist" value="70" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label>Entregó Tareas</label>
                        <select id="alum-tareas">
                            <option value="1">Sí (1)</option>
                            <option value="0">No (0)</option>
                        </select>
                    </div>
                </div>

                <button onclick="evaluarAlumno()">Evaluar Rendimiento del Alumno</button>

                <div class="output-box" id="alum-banner" style="display: none;">
                    RESULTADO: ESPERANDO EVALUACIÓN...
                </div>
            </article>

            <article class="card">
                <h2>2. Clasificador: Riesgo de Mortalidad COVID-19</h2>
                
                <div class="control-grid">
                    <div class="form-group">
                        <label>Edad del paciente</label>
                        <input type="number" id="cov-edad" value="20" min="0">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Ingreso</label>
                        <select id="cov-ingreso">
                            <option value="Hospitalización">Hospitalización</option>
                            <option value="Urgencias" selected>Urgencias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="cov-genero">
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer" selected>Mujer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel de gravedad</label>
                        <select id="cov-gravedad">
                            <option value="1">1</option>
                            <option value="2" selected>2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Diagnóstico (DX)</label>
                        <select id="cov-dx">
                            <option value="J168">- J168 - NEUMONIA DEBIDA A OTROS MICROORGANISMOS INFECCIOSOS...</option>
                            <option value="B342">B342 - INFECCION DEBIDA A CORONAVIRUS</option>
                            <option value="SARS">DX: SARS-CoV-2</option>
                            <option value="E875">E875 - HIPERPOTASEMIA</option>
                            <option value="COVID19">ENFERMEDAD POR COVID 19</option>
                            <option value="IRA">INSUFICIENCIA RESPIRATORIA AGUDA</option>
                            <option value="IRA_COMPLEJA">INSUFICIENCIA RESPIRATORIA AGUDA, NEUMONIA ATIPICA SARS-CoV-2...</option>
                            <option value="J189" selected>J189 - NEUMONIA, NO ESPECIFICADA</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Cantidad de Intervenciones</label>
                        <input type="number" id="cov-intervenciones" value="1" min="0">
                    </div>
                </div>

                <button onclick="evaluarCovid()">Evaluar Paciente Clínico</button>

                <div class="output-box" id="cov-banner" style="display: none;"></div>

                <div class="metrics-panel" id="cov-grid" style="display: none;">
                    <div class="metric-box">
                        <div class="metric-value" id="res-tubo">—</div>
                        <div class="metric-label">Req. de Tubo</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="res-estancia">—</div>
                        <div class="metric-label">Estancia Estimada</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="res-riesgo">—</div>
                        <div class="metric-label">Riesgo Proyectado</div>
                    </div>
                </div>
            </article>

        </div>
    </div>

    <script>
        let estadoAlumno = null;
        let estadoPaciente = null;

        function actualizarFondoGlobal() {
            const body = document.body;
            const alumBanner = document.getElementById('alum-banner');
            const covBanner = document.getElementById('cov-banner');
            
            let colorFondo = "var(--bg-dark)";
            
            if (estadoAlumno === "REPROBADO" && estadoPaciente === "RIESGO") {
                colorFondo = "#5c0d12";
            } else if (estadoAlumno === "APROBADO" && estadoPaciente === "SEGURO") {
                colorFondo = "#0f2d59";
            }

            body.style.backgroundColor = colorFondo;
            
            if(alumBanner.style.display !== "none") {
                alumBanner.style.backgroundColor = colorFondo;
            }
            if(covBanner.style.display !== "none") {
                covBanner.style.backgroundColor = colorFondo;
            }
        }

        function evaluarAlumno() {
            const horas = parseFloat(document.getElementById('alum-horas').value);
            const asistencia = parseFloat(document.getElementById('alum-asist').value);
            const tareas = parseInt(document.getElementById('alum-tareas').value);
            
            const banner = document.getElementById('alum-banner');
            banner.style.display = "block";

            if (horas > 5 && asistencia > 60 && tareas === 1) {
                banner.innerHTML = " ESTADO DEL ALUMNO: APROBADO :')";
                estadoAlumno = "APROBADO";
            } else {
                banner.innerHTML = " ESTADO DEL ALUMNO: REPROBADO :'(";
                estadoAlumno = "REPROBADO";
            }
            
            actualizarFondoGlobal();
        }

        function evaluarCovid() {
            const edad = parseInt(document.getElementById('cov-edad').value);
            const tipoIngreso = document.getElementById('cov-ingreso').value;
            const gravedad = parseInt(document.getElementById('cov-gravedad').value);
            const numIntervenciones = parseInt(document.getElementById('cov-intervenciones').value);
            const dx = document.getElementById('cov-dx').value;

            const banner = document.getElementById('cov-banner');
            const grid = document.getElementById('cov-grid');
            const domTubo = document.getElementById('res-tubo');
            const domEstancia = document.getElementById('res-estancia');
            const domRiesgo = document.getElementById('res-riesgo');

            banner.style.display = "block";
            grid.style.display = "grid";

            let requiereTubo = "NO";
            let diasEstancia = 1.5;
            let nivelRiesgo = "BAJO";

            if (gravedad === 3) {
                if (numIntervenciones >= 1 || edad > 60) {
                    requiereTubo = numIntervenciones > 1 ? "SÍ" : "NO";
                    nivelRiesgo = "ALTO";
                    diasEstancia = 14.5 + (edad > 65 ? 5 : 0);
                } else {
                    nivelRiesgo = "MODERADO";
                    diasEstancia = 8.0;
                }
            } else if (gravedad === 2) {
                if (tipoIngreso === "Urgencias") {
                    nivelRiesgo = "MODERADO";
                    diasEstancia = 6.5;
                    requiereTubo = numIntervenciones > 0 ? "SÍ" : "NO";
                } else {
                    nivelRiesgo = "BAJO";
                    diasEstancia = 4.2;
                }
            } else {
                nivelRiesgo = "BAJO";
                diasEstancia = 2.5;
                if (dx === "IRA_COMPLEJA" && edad > 50) {
                    diasEstancia = 5.5;
                }
            }

            if (nivelRiesgo === "ALTO") {
                estadoPaciente = "RIESGO";
            } else {
                estadoPaciente = "SEGURO";
            }

            banner.innerText = "ESTADO DEL PACIENTE: " + nivelRiesgo;
            domTubo.innerText = requiereTubo;
            domEstancia.innerText = diasEstancia.toFixed(1) + " DÍAS";
            domRiesgo.innerText = nivelRiesgo;

            actualizarFondoGlobal();
        }
    </script>
</body>
</html>
