<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Predictivo ML - Suite Unificada</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* PALETA BASE: GRIS, NEGRO Y VERDE */
            --bg-dark: #0b0f19;          /* Fondo base: Negro grisáceo */
            --card-dark: #1f2937;        /* Tarjetas: Gris oscuro */
            --surface-inner: #111827;    /* Cajas internas: Gris muy oscuro */
            --accent: #7f1d1d;           /* Botones: Rojo oscuro */
            --accent-hover: #991b1b;     /* Botones al pasar el cursor */
            --text-main: #4ade80;        /* Letras y cuadros de texto: Verde claro */
            --text-muted: #22c55e;       /* Letras secundarias: Verde medio */
            --border: #374151;           /* Bordes: Gris */
            --result-color: #ffffff;     /* Resultados: Blanco */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 30px 20px;
            transition: background-color 0.5s ease; /* Transición suave de cambio de color */
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .grid-modelos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], select {
            background-color: var(--surface-inner);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: monospace;
            transition: border-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--text-main);
        }

        button {
            background-color: var(--accent);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .metric-box {
            background-color: var(--surface-inner);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px 10px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            color: var(--result-color); /* Texto Blanco */
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.70rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .output-box {
            background-color: var(--surface-inner);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            color: var(--result-color); /* Texto Blanco */
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Alumno: Hernández Morales Luis Manuel</h1>
            <p class="subtitle">Clasificadores de Árbol de Decisión: Rendimiento Escolar y Riesgo COVID-19</p>
        </header>

        <div class="grid-modelos">
            
            <article class="card">
                <h2>1. Clasificador: Rendimiento Escolar</h2>
                
                <div class="control-grid">
                    <div class="form-group">
                        <label>Horas de Estudio</label>
                        <input type="number" id="alum-horas" value="14" min="0">
                    </div>
                    <div class="form-group">
                        <label>Asistencia (%)</label>
                        <input type="number" id="alum-asist" value="50" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label>Entregó Tareas</label>
                        <select id="alum-tareas">
                            <option value="1">Sí (1)</option>
                            <option value="0">No (0)</option>
                        </select>
                    </div>
                </div>

                <button onclick="evaluarAlumno()">Evaluar Rendimiento del Alumno</button>

                <div class="output-box" id="alum-banner" style="display: none;">
                    RESULTADO: ESPERANDO EVALUACIÓN...
                </div>
            </article>

            <article class="card">
                <h2>2. Clasificador: Riesgo de Mortalidad COVID-19</h2>
                
                <div class="control-grid">
                    <div class="form-group">
                        <label>Edad del paciente</label>
                        <input type="number" id="cov-edad" value="45" min="0">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Ingreso</label>
                        <select id="cov-ingreso">
                            <option value="Hospitalización">Hospitalización</option>
                            <option value="Urgencias">Urgencias</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="cov-genero">
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel de gravedad</label>
                        <select id="cov-gravedad">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3" selected>3</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Diagnóstico (DX)</label>
                        <select id="cov-dx">
                            <option value="J168">- J168 - NEUMONIA DEBIDA A OTROS MICROORGANISMOS INFECCIOSOS...</option>
                            <option value="B342">B342 - INFECCION DEBIDA A CORONAVIRUS</option>
                            <option value="SARS">DX: SARS-CoV-2</option>
                            <option value="E875">E875 - HIPERPOTASEMIA</option>
                            <option value="COVID19">ENFERMEDAD POR COVID 19</option>
                            <option value="IRA">INSUFICIENCIA RESPIRATORIA AGUDA</option>
                            <option value="IRA_COMPLEJA">INSUFICIENCIA RESPIRATORIA AGUDA, NEUMONIA ATIPICA SARS-CoV-2...</option>
                            <option value="J189">J189 - NEUMONIA, NO ESPECIFICADA</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Cantidad de Intervenciones</label>
                        <input type="number" id="cov-intervenciones" value="1" min="0">
                    </div>
                </div>

                <button onclick="evaluarCovid()">Evaluar Paciente Clínico</button>

                <div class="output-box" id="cov-banner" style="display: none;"></div>

                <div class="metrics-panel" id="cov-grid" style="display: none;">
                    <div class="metric-box">
                        <div class="metric-value" id="res-tubo">—</div>
                        <div class="metric-label">Req. de Tubo</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="res-estancia">—</div>
                        <div class="metric-label">Estancia Estimada</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="res-riesgo">—</div>
                        <div class="metric-label">Riesgo Proyectado</div>
                    </div>
                </div>
            </article>

        </div>
    </div>

    <script>
        // Variables de estado globales para rastrear el resultado de ambos modelos
        let estadoAlumno = null; // Guardará "APROBADO" o "REPROBADO"
        let estadoPaciente = null; // Guardará "RIESGO" o "SEGURO"

        // ==========================================
        // CONTROL EVALUADOR DINÁMICO DEL FONDO (BODY)
        // ==========================================
        function actualizarFondoGlobal() {
            const body = document.body;

            // Condición 1: Ambos están en estado crítico -> Fondo rojo oscuro
            if (estadoAlumno === "REPROBADO" && estadoPaciente === "RIESGO") {
                body.style.backgroundColor = "#5c0d12"; 
            } 
            // Condición 2: Ambos están a salvo -> Fondo azul oscuro
            else if (estadoAlumno === "APROBADO" && estadoPaciente === "SEGURO") {
                body.style.backgroundColor = "#0f2d59"; 
            } 
            // Condición 3: Mismatch u estados contrarios -> Retorna a gris/negro inicial
            else {
                body.style.backgroundColor = "var(--bg-dark)"; 
            }
        }

        // ==========================================
        // LÓGICA MATEMÁTICA: ÁRBOL DE ALUMNOS
        // ==========================================
        function evaluarAlumno() {
            const horas = parseFloat(document.getElementById('alum-horas').value);
            const asistencia = parseFloat(document.getElementById('alum-asist').value);
            const tareas = parseInt(document.getElementById('alum-tareas').value);
            
            const banner = document.getElementById('alum-banner');
            banner.style.display = "block";

            if (horas > 5 && asistencia > 60 && tareas === 1) {
                banner.innerHTML = "🏅 ESTADO PREDICHO: APROBADO 🏅";
                estadoAlumno = "APROBADO";
            } else {
                banner.innerHTML = "💀 ESTADO PREDICHO: REPROBADO 💀";
                estadoAlumno = "REPROBADO";
            }
            
            banner.style.color = "var(--result-color)";
            actualizarFondoGlobal(); // Disparar la comprobación del fondo
        }

        // ==========================================
        // LÓGICA MATEMÁTICA: ÁRBOL CLÍNICO COVID-19
        // ==========================================
        function evaluarCovid() {
            const edad = parseInt(document.getElementById('cov-edad').value);
            const tipoIngreso = document.getElementById('cov-ingreso').value;
            const gravedad = parseInt(document.getElementById('cov-gravedad').value);
            const numIntervenciones = parseInt(document.getElementById('cov-intervenciones').value);
            const dx = document.getElementById('cov-dx').value;

            const banner = document.getElementById('cov-banner');
            const grid = document.getElementById('cov-grid');
            const domTubo = document.getElementById('res-tubo');
            const domEstancia = document.getElementById('res-estancia');
            const domRiesgo = document.getElementById('res-riesgo');

            banner.style.display = "block";
            grid.style.display = "grid";

            let requiereTubo = "NO";
            let diasEstancia = 1.5;
            let nivelRiesgo = "BAJO";
            let resPrinc = "";

            // Procesamiento de ramas del árbol
            if (gravedad === 3) {
                if (numIntervenciones >= 1 || edad > 60) {
                    requiereTubo = numIntervenciones > 1 ? "SÍ" : "NO";
                    nivelRiesgo = "ALTO";
                    diasEstancia = 14.5 + (edad > 65 ? 5 : 0);
                    resPrinc = "NIVEL DE PELIGRO: ALTO";
                } else {
                    nivelRiesgo = "MODERADO";
                    diasEstancia = 8.0;
                    resPrinc = "NIVEL DE PELIGRO: MODERADO";
                }
            } else if (gravedad === 2) {
                if (tipoIngreso === "Urgencias") {
                    nivelRiesgo = "MODERADO";
                    diasEstancia = 6.5;
                    requiereTubo = numIntervenciones > 0 ? "SÍ" : "NO";
                    resPrinc = "NIVEL DE PELIGRO: MODERADO";
                } else {
                    nivelRiesgo = "BAJO";
                    diasEstancia = 4.2;
                    resPrinc = "NIVEL DE PELIGRO: MODERADO / BAJO";
                }
            } else {
                nivelRiesgo = "BAJO";
                diasEstancia = 2.5;
                if (dx === "IRA_COMPLEJA" && edad > 50) {
                    diasEstancia = 5.5;
                }
                resPrinc = "NIVEL DE PELIGRO: BAJO";
            }

            // Mapeo lógico de estados clínicos para el fondo interactivo
            if (nivelRiesgo === "ALTO") {
                estadoPaciente = "RIESGO";
            } else {
                estadoPaciente = "SEGURO"; // Bajo y Moderado cuentan como fuera de peligro crítico
            }

            // Inyectar textos (Manteniendo todo el contenido en blanco)
            banner.innerText = resPrinc;
            domTubo.innerText = requiereTubo;
            domEstancia.innerText = diasEstancia.toFixed(1) + " DÍAS";
            domRiesgo.innerText = nivelRiesgo;

            // Garantizar consistencia de salida blanca
            banner.style.color = "var(--result-color)";
            domTubo.style.color = "var(--result-color)";
            domEstancia.style.color = "var(--result-color)";
            domRiesgo.style.color = "var(--result-color)";

            actualizarFondoGlobal(); // Disparar la comprobación del fondo
        }
    </script>
</body>
</html>
